<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Video Virall</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none; /* Mencegah interaksi klik langsung ke video */
    }

    /* Popup Styles */
    .popup-overlay {
      display: flex; /* Langsung muncul di awal */
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .popup-box {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      animation: slideUp 0.3s ease-in-out;
    }

    .popup-box h2 {
      margin-top: 0;
      font-size: 20px;
      color: #333;
    }

    .popup-box p {
      font-size: 15px;
      color: #555;
      margin: 16px 0;
    }

    .popup-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .popup-buttons button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .popup-buttons button:first-child {
      background: #e0e0e0;
      color: #333;
    }

    .popup-buttons button:last-child {
      background: #ff3c5f;
      color: #fff;
    }

    .popup-buttons button:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Tanpa controls dan autoplay, video bersih tanpa tombol play -->
  <video id="video" muted playsinline>
    <source src="https://stream.vidhosting.in/videos/e33a0746.mp4" type="video/mp4">
    Browser kamu tidak mendukung video.
  </video>
</div>

<!-- Popup Overlay (Muncul pertama kali saat halaman dibuka) -->
<div id="popup-overlay" class="popup-overlay">
  <div class="popup-box">
    <h2>Konfirmasi Usia</h2>
    <p>Video ini mengandung konten dewasa. Apakah Anda berusia di atas 18 tahun dan ingin melanjutkan?</p>
    <div class="popup-buttons">
      <button onclick="handleAction()">BATAL</button>
      <button onclick="handleAction()">LANJUT</button>
    </div>
  </div>
</div>

<script>
  const smartlinkURL = 'https://www.profitableratecpmnetwork.com/hh55phupz7?key=035891703dff41ba6e0911050a5989af';
  const video = document.getElementById("video");
  const popup = document.getElementById("popup-overlay");
  let timer = null;

  function startTimer() {
    // Setiap video berjalan, set jeda 5 detik untuk memunculkan popup kembali
    clearTimeout(timer);
    timer = setTimeout(function() {
      video.pause();
      popup.style.display = "flex";
    }, 5000); // 5000ms = 5 detik
  }

  // Fungsi saat tombol BATAL atau LANJUT diklik
  function handleAction() {
    // Buka Smartlink Adsterra ke tab baru
    window.open(smartlinkURL, '_blank');

    // Sembunyikan popup dan putar video kembali
    popup.style.display = 'none';
    video.play().catch(() => {});

    // Jalankan hitung mundur 5 detik berikutnya
    startTimer();
  }
</script>

</body>
</html>
